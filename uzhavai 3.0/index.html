    *, *::before, *::after { box-sizing: border-box; }

    :root {

    html { scroll-behavior: smooth; }

      -webkit-font-smoothing: antialiased;

    .scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
    .scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Animations */
    @keyframes border-blink {
      0%,100% { border-color: rgba(239,68,68,0.3); }
      50%      { border-color: rgba(239,68,68,0.9); }
    }
    .blink-border { animation: border-blink 1.4s ease-in-out infinite; }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .slide-up { animation: slideUp 0.3s ease-out both; }

    @keyframes fadeIn {
      from { opacity:0; } to { opacity:1; }
    }
    .fade-in { animation: fadeIn 0.4s ease-out both; }

    @keyframes waveBounce {
      0%,100% { transform: scaleY(0.2); }
      50%      { transform: scaleY(1.2); }
    }
    .wave-bar { animation: waveBounce 0.75s ease-in-out infinite; transform-origin: bottom; }

    @keyframes typingDot {
      0%,60%,100% { transform:translateY(0); opacity:0.4; }
      30%          { transform:translateY(-5px); opacity:1; }
    }
    .tdot { animation: typingDot 1.3s infinite; }
    .tdot:nth-child(2) { animation-delay: 0.15s; }
    .tdot:nth-child(3) { animation-delay: 0.30s; }

    @keyframes pulseRing {
      0%   { transform:scale(1);   opacity:1; }
      100% { transform:scale(1.6); opacity:0; }
    }
    .pulse-ring::before {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      background:rgba(239,68,68,0.3);
      animation: pulseRing 1.4s cubic-bezier(0.4,0,0.6,1) infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
      background-size: 400px 100%;
      animation: shimmer 2s infinite linear;
    }

    /* Card hover */
    .card-lift { transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .card-lift:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12); }

    /* Progress bar */
    .prog { transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }

    /* Range inputs */
    input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:6px; outline:none; cursor:pointer; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
      background:white; border:2.5px solid #10b981;
      box-shadow:0 2px 8px rgba(16,185,129,0.4); cursor:pointer;
    }
    input[type=range]:focus::-webkit-slider-thumb { border-color: #059669; }

    /* Phone frame */
    .phone-frame {
      background: linear-gradient(145deg, #1a2035, #0c1120);
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 0 0 1.5px #2a3350,
                  0 30px 60px -15px rgba(0,0,0,0.5),
                  inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* WA bubble tail */
    .wa-tail { position:relative; }
    .wa-tail::before {
      content:''; position:absolute; top:0; left:-7px;
      border:7px solid transparent;
      border-top-color:#1e293b;
      border-right-color:#1e293b;
    }

    /* Glassmorphism */
    .glass {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Touch target baseline */
    .touch-target { min-height: 44px; min-width: 44px; }

    /* Voice speaking highlight */
    @keyframes speakPulse {
      0%,100% { opacity:1; }
      50%      { opacity:0.5; }
    }
    .speak-pulse { animation: speakPulse 1.5s ease-in-out infinite; }

    /* Mobile tap highlight */
    * { -webkit-tap-highlight-color: transparent; }

    /* No horizontal overflow */
    .no-overflow { max-width: 100%; overflow-x: hidden; }

    /* Responsive text */
    .text-responsive { font-size: clamp(0.75rem, 3vw, 1rem); }
    .heading-responsive { font-size: clamp(1rem, 4vw, 1.25rem); }

    /* ---- SPLASH SCREEN ANIMATIONS ---- */
    @keyframes revealUp {
      0% { opacity: 0; transform: translateY(20px); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes blurFadeIn {
      0% { opacity: 0; filter: blur(8px); }
      100% { opacity: 1; filter: blur(0); }
    }
    @keyframes particleFloat {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
    }
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes premiumGlow {
      0% { filter: drop-shadow(0 0 0 rgba(16, 185, 129, 0)); }
      100% { filter: drop-shadow(0 0 35px rgba(16, 185, 129, 0.6)); }
    }
    @keyframes splashFadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-anim { animation: none !important; transition: opacity 0.5s !important; }
    }
  </style>

  function SplashScreen({ onComplete }) {
    const [msgIndex, setMsgIndex] = useState(0);
    const [isComplete, setIsComplete] = useState(false);
    const [isFadingOut, setIsFadingOut] = useState(false);
    
    const messages = [
      "Initializing Smart Storage...",
      "Connecting Edge Controller...",
      "Initializing ESP32...",
      "Reading Storage Sensors...",
      "Analyzing Shelf Life...",
      "Generating Farmer Recommendations...",
      "Preparing Dashboard...",
      "System Ready"
    ];

    useEffect(() => {
      // 2.5s total duration. Messages cycle over ~1.8s.
      // Message changes every ~250ms
      const interval = setInterval(() => {
        setMsgIndex(prev => {
          if (prev >= messages.length - 2) {
            clearInterval(interval);
            setTimeout(() => setMsgIndex(messages.length - 1), 200); // System Ready
            return prev + 1;
          }
          return prev + 1;
        });
      }, 250);

      const completeTimer = setTimeout(() => {
        setIsComplete(true);
      }, 2100); // Glow kicks in at 2.1s

      const fadeTimer = setTimeout(() => {
        setIsFadingOut(true);
      }, 2500); // Start fade out at 2.5s

      const unmountTimer = setTimeout(() => {
        onComplete();
      }, 3000); // Fully remove from DOM

      return () => {
        clearInterval(interval);
        clearTimeout(completeTimer);
        clearTimeout(fadeTimer);
        clearTimeout(unmountTimer);
      };
    }, []);

    // Particles array for background
    const particles = Array.from({ length: 15 }).map((_, i) => ({
      id: i,
      left: Math.random() * 100 + '%',
      top: Math.random() * 100 + '%',
      size: Math.random() * 6 + 2 + 'px',
      delay: Math.random() * 2 + 's',
      duration: Math.random() * 3 + 4 + 's'
    }));

    return (
      <div class={`fixed inset-0 z-[9999] bg-gradient-to-br from-slate-900 via-[#0a1120] to-slate-900 flex flex-col items-center justify-center overflow-hidden transition-opacity duration-500 ${isFadingOut ? 'opacity-0' : 'opacity-100'}`}>
        
        {/* Background particles */}
        <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40">
          {particles.map(p => (
            <div key={p.id} class="absolute rounded-full bg-emerald-500/20 blur-[1px]" 
                 style={{
                   left: p.left, top: p.top, width: p.size, height: p.size,
                   animation: `particleFloat ${p.duration} linear infinite`,
                   animationDelay: p.delay
                 }}
            />
          ))}
          {/* Subtle gradient orb */}
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-900/20 rounded-full blur-[100px] pointer-events-none"></div>
        </div>

        {/* Center Content */}
        <div class="relative z-10 flex flex-col items-center text-center">
          
          {/* Logo & Titles */}
          <div class="mb-10 flex flex-col items-center">
            <div class="text-6xl mb-4 splash-anim" style={{ animation: 'revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards', animationDelay: '0.1s', opacity: 0 }}>
              <span class="inline-block transition-all duration-700" style={{ filter: isComplete ? 'drop-shadow(0 0 25px rgba(16, 185, 129, 0.6))' : 'none' }}>
                🌾
              </span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black text-white tracking-tight splash-anim" style={{ animation: 'blurFadeIn 0.8s ease-out forwards', animationDelay: '0.4s', opacity: 0 }}>
              UZHAVAI
            </h1>
            <h2 class="text-2xl sm:text-3xl font-ta text-emerald-400 mt-1 splash-anim" style={{ animation: 'blurFadeIn 0.8s ease-out forwards', animationDelay: '0.7s', opacity: 0 }}>
              உழவை
            </h2>
          </div>

          {/* Tagline sequence */}
          <div class="flex gap-2 text-sm sm:text-base font-bold text-slate-400 mb-12">
            <span class="splash-anim" style={{ animation: 'blurFadeIn 0.6s forwards', animationDelay: '1.0s', opacity: 0 }}>Monitor Smarter.</span>
            <span class="splash-anim" style={{ animation: 'blurFadeIn 0.6s forwards', animationDelay: '1.3s', opacity: 0 }}>Store Better.</span>
            <span class="text-emerald-400 splash-anim" style={{ animation: 'blurFadeIn 0.6s forwards', animationDelay: '1.6s', opacity: 0 }}>Sell First.</span>
          </div>

          {/* Loading Bar & Messages */}
          <div class="w-64 max-w-full px-4 splash-anim" style={{ animation: 'blurFadeIn 0.5s forwards', animationDelay: '0.5s', opacity: 0 }}>
            <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden mb-3 relative">
              <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-emerald-500 to-emerald-300 rounded-full splash-anim" 
                   style={{ width: '0%', animation: 'progressFill 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards', animationDelay: '0.5s' }}>
              </div>
            </div>
            <div class="h-4 relative overflow-hidden">

                     class={`absolute inset-0 text-[10px] sm:text-xs font-semibold tracking-wider uppercase transition-all duration-300 ${msgIndex === idx ? 'opacity-100 translate-y-0 text-slate-300' : msgIndex > idx ? 'opacity-0 -translate-y-4 text-emerald-400' : 'opacity-0 translate-y-4 text-slate-500'}`}>

    const t     = k => D[lang]?.[k] ?? D.en?.[k] ?? k;
    const cname = z => lang === 'ta' ? z.cropTa    : z.cropEn;
    const zdesc = z => lang === 'ta' ? z.zoneDescTa : z.zoneDescEn;

    /* ---- INIT ZONES ---- */
    const INIT = [
      {
        id:'zoneA', cropEn:'Spinach', cropTa:'கீரை', emoji:'🥬', icon:'leaf',
        zoneName:'Zone A', zoneDescEn:'High Humidity', zoneDescTa:'உயர் ஈரப்பதம்',
        iconBg:'bg-emerald-100', iconTx:'text-emerald-700',
        idealTemp:22, idealHumidity:85, minHumidity:70, maxTemp:28, maxHumidity:null,

        iconBg:'bg-red-100', iconTx:'text-red-600',
        idealTemp:18, idealHumidity:70, minHumidity:50, maxTemp:30, maxHumidity:null,

        temperature:18, humidity:70, storedDay:1, storedTime:'09:30 AM',

      {

        iconBg:'bg-purple-100', iconTx:'text-purple-700',
        idealTemp:20, idealHumidity:50, minHumidity:30, maxTemp:35, maxHumidity:60,
        baseShelfLife:30, degradationFactor:0.1,

    const [zones, setZones] = useState(INIT);

    /* ---- SIMULATION ENGINE ---- */
    const calcZone = (z, day) => {
      const duration = Math.max(0, day - z.storedDay);
      let penalty = 0;
      const issues = [];
      if (z.minHumidity && z.humidity < z.minHumidity) {
        penalty += 1;
        issues.push({ en:`Humidity ${z.humidity}% below minimum ${z.minHumidity}%.`, ta:`ஈரப்பதம் குறைந்தது — ${z.humidity}% (குறைந்தபட்சம் ${z.minHumidity}%).` });
      }
      if (z.maxHumidity && z.humidity > z.maxHumidity) {
        penalty += 5;
        issues.push({ en:`Humidity ${z.humidity}% exceeds maximum ${z.maxHumidity}%.`, ta:`ஈரப்பதம் அதிகம் — ${z.humidity}% (அதிகபட்சம் ${z.maxHumidity}%).` });
      }
      if (z.maxTemp && z.temperature > z.maxTemp) {
        const ex = z.temperature - z.maxTemp;
        penalty += Math.min(ex * 0.5, 3);
        issues.push({ en:`Temperature ${z.temperature}°C exceeds threshold ${z.maxTemp}°C.`, ta:`வெப்பநிலை அதிகம் — ${z.temperature}°C (வரம்பு ${z.maxTemp}°C).` });
      }
      const remaining = parseFloat(Math.max(0, z.baseShelfLife - duration * z.degradationFactor - penalty).toFixed(2));
      const pct = Math.min(100, Math.max(0, (remaining / z.baseShelfLife) * 100));

      let status, badgeCls, borderCls, progColor, textCls;
      if (pct < 10) {
        status='Sell Today';
        badgeCls='bg-red-100 text-red-800 border-red-300 animate-pulse';
        borderCls='border-red-200 blink-border bg-red-50/20';
        progColor='bg-gradient-to-r from-red-500 to-red-600';
        textCls='text-red-600 font-bold';
      } else if (pct <= 40) {
        status='Sell Soon';
        badgeCls='bg-amber-100 text-amber-800 border-amber-200';
        borderCls='border-amber-200 bg-amber-50/20';
        progColor='bg-gradient-to-r from-amber-400 to-orange-500';
        textCls='text-amber-600 font-semibold';
      } else {
        status='Safe';
        badgeCls='bg-emerald-100 text-emerald-800 border-emerald-200';
        borderCls='border-slate-100 bg-white';
        progColor='bg-gradient-to-r from-emerald-400 to-emerald-500';
        textCls='text-emerald-600';
      }

      let reasonEn = `${z.cropEn} stored for ${duration} day(s). `;
      let reasonTa = `${z.cropTa} ${duration} நாட்களாகச் சேமிப்பில் உள்ளது. `;
      if (issues.length) {
        reasonEn += issues.map(i => i.en).join(' ') + ' Spoilage is accelerating.';
        reasonTa += issues.map(i => i.ta).join(' ') + ' அழுகும் வேகம் அதிகரித்தது.';
      } else {
        reasonEn += 'Storage conditions are optimal.';
        reasonTa += 'சேமிப்பு சூழல் சிறப்பாக உள்ளது.';
      }
      if (status === 'Sell Today') {
        reasonEn += ' Sell immediately to avoid post-harvest loss.';
        reasonTa += ' இழப்பைத் தவிர்க்க உடனே விற்கவும்.';
      } else if (status === 'Sell Soon') {
        reasonEn += ' Plan to sell within 1–2 days for the best price.';
        reasonTa += ' சிறந்த விலைக்கு 1–2 நாட்களில் விற்க திட்டமிடுங்கள்.';
      } else {
        reasonEn += ' Safe to continue storing under current conditions.';
        reasonTa += ' தற்போதைய சூழலில் தொடர்ந்து சேமிக்கலாம்.';
      }

      const profitProtected = Math.round(z.kgStored * z.pricePerKg * (pct / 100));
      const tempDev = +(z.temperature - z.idealTemp).toFixed(1);
      const humDev  = +(z.humidity   - z.idealHumidity).toFixed(0);

      return { ...z, remaining, pct, status, badgeCls, borderCls, progColor, textCls, reasonEn, reasonTa, profitProtected, tempDev, humDev, duration };
    };

    /* ---- DERIVED STATE ---- */
    const liveZones   = zones.map(z => calcZone(z, currentDay));
    const statusOrder = { 'Sell Today':0, 'Sell Soon':1, 'Safe':2 };

          newN.push({ id:Date.now()+Math.random()+1, type:'sms', time:timeStr,
            en:`UZHAVAI: ${z.cropEn} (${z.zoneName}) SELL SOON. Loss risk increasing. Act within 48 hrs.`,
            ta:`உழவை: ${z.cropTa} (${z.zoneName}) விரைவில் விற்க. 48 மணி நேரத்தில் நடவடிக்கை எடுக்கவும்.` });
        } else if (z.status === 'Sell Today') {
          newN.push({ id:Date.now()+Math.random(), type:'whatsapp', emoji:z.emoji, status:z.status, time:timeStr,
            en:`🔴 *SELL TODAY — ${z.cropEn}*\n${z.zoneName} · ${tLeft} remaining\nIncome saved if sold now: ₹${income}\nPost-harvest loss risk: HIGH`,
            ta:`🔴 *இன்றே விற்கவும் — ${z.cropTa}*\n${z.zoneName} · ${tLeft} மீதம்\nவிற்றால் பாதுகாக்கப்படும்: ₹${income}\nஇழப்பு அபாயம்: அதிகம்` });
          newN.push({ id:Date.now()+Math.random()+1, type:'sms', time:timeStr,
            en:`CRITICAL: Sell ${z.cropEn} (${z.zoneName}) TODAY. Income at risk: ₹${income}. Post-harvest loss imminent.`,

        return `கவனம் விவசாயரே. மண்டலம் ${zoneNum}-வில் உள்ள ${name}யை ${urgency}. இன்னும் சுமார் ${tLeft} மட்டுமே தரம் நீடிக்கும். உங்கள் வருமானத்தை பாதுகாக்க உடனடியாக சந்தைக்கு எடுத்துச் செல்லுங்கள்.`;

      const secs  = Math.ceil(words / wpm * 60);
      return secs < 60 ? `~${secs}s` : `~${Math.floor(secs/60)}m ${secs%60}s`;
    }, [voiceText, lang]);

    /* ---- VOICE CONTROLS ---- */
    const playVoice = () => {
      if (voiceStatus === 'paused') {
        window.speechSynthesis.resume();
        setVoiceStatus('speaking');
        return;
      }
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const text = voiceText();
      const u = new SpeechSynthesisUtterance(text);
      u.lang   = lang === 'ta' ? 'ta-IN' : 'en-IN';
      u.rate   = lang === 'ta' ? 0.9 : 1.0;
      u.pitch  = 1.0;
      u.volume = 1.0;
      if (lang === 'ta' && voices.ta) u.voice = voices.ta;
      else if (lang === 'en' && voices.en) u.voice = voices.en;
      u.onstart  = () => { setVoiceStatus('speaking'); setHasSpoken(true); };
      u.onend    = () => setVoiceStatus('idle');
      u.onerror  = () => setVoiceStatus('idle');
      utterRef.current = u;
      window.speechSynthesis.speak(u);
    };

    const pauseVoice = () => {
      if (window.speechSynthesis) { window.speechSynthesis.pause(); setVoiceStatus('paused'); }

                  <div class="min-w-0 flex-1">
                    <div class="text-xs font-black text-white">UZHAVAI AI</div>
                    <div class="text-[9px] text-green-400 font-semibold">{t('waOnline')}</div>
                  </div>
                </div>
                {/* Messages */}
                <div class="flex-1 p-3 space-y-3 overflow-y-auto scroll bg-slate-950">
                  {/* Welcome */}
                  <div class="flex items-start gap-2">
                    <div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center text-xs flex-shrink-0">🌾</div>
                    <div class="relative wa-tail bg-slate-800 rounded-r-2xl rounded-bl-2xl px-3 py-2.5 max-w-[85%]">
                      <div class="text-[10px] font-black text-green-400 mb-1">UZHAVAI</div>
                      <p class="text-[10px] text-slate-300 leading-relaxed font-medium break-words">{t('waWelcome')}</p>
                      <div class="text-[8px] text-slate-600 mt-1 text-right">09:00 ✓✓</div>
                    </div>
                  </div>
                  {/* Dynamic alerts */}
                  {notifs.filter(n=>n.type==='whatsapp').map(notif => (
                    <div key={notif.id} class="flex items-start gap-2 slide-up">
                      <div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center text-xs flex-shrink-0">{notif.emoji||'🌾'}</div>
                      <div class={`relative wa-tail rounded-r-2xl rounded-bl-2xl px-3 py-2.5 max-w-[85%] border ${
                        notif.isRestock?'bg-emerald-950/70 border-emerald-900/40':
                        notif.status==='Sell Today'?'bg-red-950/60 border-red-900/40':
                        notif.status==='Sell Soon'?'bg-amber-950/60 border-amber-900/40':
                        'bg-slate-800 border-transparent'
                      }`}>
                        <div class={`text-[10px] font-black mb-1 ${notif.isRestock?'text-emerald-400':notif.status==='Sell Today'?'text-red-400':notif.status==='Sell Soon'?'text-amber-400':'text-green-400'}`}>UZHAVAI</div>
                        <p class="text-[10px] text-slate-300 leading-relaxed font-medium whitespace-pre-line break-words">{lang==='ta'?notif.ta:notif.en}</p>
                        <div class="text-[8px] text-slate-600 mt-1 text-right">{notif.time} ✓✓</div>
                      </div>
                    </div>
                  ))}
                  {/* Typing */}
                  {showTyping && (
                    <div class="flex items-start gap-2 fade-in">
                      <div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center text-xs flex-shrink-0">🌾</div>
                      <div class="bg-slate-800 rounded-r-2xl rounded-bl-2xl px-4 py-3">
                        <div class="flex items-center gap-1.5">
                          {[0,1,2].map(i => <div key={i} class="w-1.5 h-1.5 bg-slate-400 rounded-full tdot"></div>)}
                        </div>
                      </div>
                    </div>
                  )}
                  {notifs.filter(n=>n.type==='whatsapp').length===0 && !showTyping && (
                    <div class="text-center py-8">
                      <div class="text-2xl mb-2">💬</div>
                      <p class="text-[10px] text-slate-600 font-medium break-words px-4">{lang==='ta'?'சேமிப்பு நிலை மாறும்போது அறிவிப்புகள் இங்கே தோன்றும்.':'Alerts appear here when storage conditions change.'}</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* SMS */}
            {phoneTab==='sms' && (
              <div class="flex flex-col flex-1 overflow-hidden">
                <div class="flex items-center gap-3 px-4 py-2.5 bg-blue-950/40 border-b border-slate-800 flex-shrink-0">
                  <div class="w-9 h-9 rounded-full bg-blue-700 flex items-center justify-center text-[10px] font-black text-white flex-shrink-0">SMS</div>
                  <div class="min-w-0">
                    <div class="text-xs font-black text-white">UZHAVAI-ALERTS</div>
                    <div class="text-[9px] text-slate-400 font-semibold">{lang==='ta'?'தானியங்கி SMS':'Automated alert service'}</div>
                  </div>
                </div>
                <div class="flex-1 p-3 space-y-2 overflow-y-auto scroll bg-slate-100">
                  <div class="flex justify-start">
                    <div class="bg-white rounded-2xl rounded-tl-none p-3 max-w-[85%] shadow-sm border border-slate-100">
                      <p class="text-[10px] text-slate-700 font-medium leading-relaxed break-words">{t('smsWelcome')}</p>
                      <div class="text-[8px] text-slate-400 mt-1">09:00 AM</div>
                    </div>
                  </div>
                  {notifs.filter(n=>n.type==='sms').map(notif => (
                    <div key={notif.id} class="flex justify-start slide-up">
                      <div class={`rounded-2xl rounded-tl-none p-3 max-w-[85%] shadow-sm border break-words ${(lang==='en'?notif.en:notif.ta).includes('CRITICAL')||(lang==='ta'?notif.ta:notif.en).includes('அவசரம்')?'bg-red-50 border-red-200':'bg-amber-50 border-amber-100'}`}>
                        <p class="text-[10px] font-semibold leading-relaxed text-slate-700">{lang==='ta'?notif.ta:notif.en}</p>
                        <div class="text-[8px] text-slate-400 mt-1">{notif.time}</div>
                      </div>
                    </div>
                  ))}
                  {notifs.filter(n=>n.type==='sms').length===0 && (
                    <div class="text-center py-8">
                      <div class="text-2xl mb-2">📱</div>
                      <p class="text-[10px] text-slate-400 font-medium">{lang==='ta'?'SMS எச்சரிக்கைகள் இங்கே தோன்றும்.':'SMS alerts appear here.'}</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VOICE */}
            {phoneTab==='voice' && (
              <div class="flex-1 overflow-y-auto scroll p-4 space-y-3 bg-slate-950">
                {/* Voice system info */}
                <div class="bg-slate-900 rounded-2xl p-3.5 border border-slate-800" role="status" aria-live="polite">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">{t('voiceReady')}</span>
                    <span class={`text-[9px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1.5 ${
                      voiceStatus==='speaking' ? 'bg-green-900/60 text-green-300 border border-green-800/50 speak-pulse' :
                      voiceStatus==='paused'   ? 'bg-amber-900/60 text-amber-300 border border-amber-800/50' :
                                                 'bg-slate-800 text-slate-500 border border-slate-700'
                    }`}>
                      {voiceStatus==='speaking' && <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>}
                      {voiceStatus==='speaking' ? t('voiceStatus_speaking') : voiceStatus==='paused' ? t('voiceStatus_paused') : t('voiceStatus_idle')}
                    </span>
                  </div>
                  <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                      <span class="text-[9px] text-slate-500 font-bold uppercase">{t('voiceLang')}</span>
                      <span class="text-[10px] text-slate-300 font-bold">{lang==='ta'?'Tamil (ta-IN)':'English (en-IN)'}</span>
                    </div>
                    <div class="flex justify-between items-start gap-2">
                      <span class="text-[9px] text-slate-500 font-bold uppercase flex-shrink-0">{t('voiceName')}</span>
                      <span class="text-[10px] text-slate-300 font-bold text-right break-words max-w-[65%]">
                        {lang==='ta'
                          ? (voices.ta ? voices.ta.name : <span class="text-amber-400">{lang==='ta'?'இயல்புநிலை':'Default'}</span>)
                          : (voices.en ? voices.en.name : 'Browser Default')}
                      </span>
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-[9px] text-slate-500 font-bold uppercase">{t('voiceDuration')}</span>
                      <span class="text-[10px] text-slate-300 font-bold">{estimatedDuration()}</span>
                    </div>
                  </div>
                  {lang==='ta' && !voices.ta && (
                    <div class="mt-2 text-[9px] text-amber-400 font-bold bg-amber-950/30 rounded-lg px-2 py-1.5 border border-amber-900/30 break-words">
                      ⚠ {t('voiceNoTamil')}
                    </div>
                  )}
                </div>

                {/* Waveform */}
                <div class="flex items-end justify-center gap-0.5 h-10 px-2">
                  {[4,7,5,11,6,9,3,12,5,8,4,10,6,8,5,7,4].map((h,i) => (
                    <div key={i}
                      class={`flex-1 rounded-full transition-all duration-150 ${
                        voiceStatus==='speaking' ? 'bg-amber-400 wave-bar' :
                        voiceStatus==='paused'   ? 'bg-amber-600/50' :
                                                   'bg-slate-700'
                      }`}
                      style={{height:`${voiceStatus==='speaking'?h*2.8:4}px`, animationDelay:`${i*0.065}s`}}>
                    </div>
                  ))}
                </div>

                {/* Controls */}
                <div class="flex gap-2">
                  {voiceStatus==='idle' && (
                    <button onClick={playVoice} aria-label="Play voice alert"
                      class="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-2xl text-xs flex items-center justify-center gap-2 transition-all touch-target active:scale-95">
                      <Icon name="play" className="w-4 h-4" />{t('voicePlay')}
                    </button>
                  )}
                  {voiceStatus==='speaking' && (
                    <>
                      <button onClick={pauseVoice} aria-label="Pause voice"
                        class="flex-1 py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 transition-all touch-target active:scale-95">
                        <Icon name="pause" className="w-4 h-4" />{t('voicePause')}
                      </button>
                      <button onClick={stopVoice} aria-label="Stop voice"
                        class="py-3 px-4 bg-red-900/40 hover:bg-red-900/60 border border-red-800/40 text-red-300 font-bold rounded-2xl text-xs flex items-center gap-1.5 transition-all touch-target active:scale-95">
                        <Icon name="stop" className="w-4 h-4" />{t('voiceStop')}
                      </button>
                    </>
                  )}
                  {voiceStatus==='paused' && (
                    <>
                      <button onClick={playVoice} aria-label="Resume voice"
                        class="flex-1 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 transition-all touch-target active:scale-95">
                        <Icon name="play" className="w-4 h-4" />{t('voiceResume')}
                      </button>
                      <button onClick={stopVoice} aria-label="Stop voice"
                        class="py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold rounded-2xl text-xs flex items-center gap-1.5 transition-all touch-target active:scale-95">
                        <Icon name="stop" className="w-4 h-4" />{t('voiceStop')}
                      </button>
                    </>
                  )}
                </div>

                {/* Replay */}
                {voiceStatus==='idle' && hasSpoken && (
                  <button onClick={playVoice} aria-label="Replay voice alert"
                    class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all touch-target border border-slate-700">
                    <Icon name="refresh" className="w-3 h-3" />{t('voiceReplay')}
                  </button>
                )}

                {/* Transcript */}
                <div class="bg-slate-900/80 rounded-2xl p-3.5 border border-slate-800/50">
                  <div class="text-[9px] font-black text-amber-400/80 uppercase tracking-widest mb-2 flex items-center gap-1.5">
                    <Icon name="mic" className="w-3 h-3" />{t('transcript')}
                  </div>
                  <p class={`text-[10px] leading-relaxed font-medium break-words transition-all duration-300 p-2 rounded-xl ${voiceStatus==='speaking'?'text-amber-50 bg-amber-900/30 border border-amber-800/50 shadow-inner shadow-amber-900/20':'text-slate-400 border border-transparent'}`}>
                    {voiceText()}
                  </p>
                </div>

                {/* Language pills */}
                <div class="flex justify-center gap-2 pb-2">
                  <span class={`text-[9px] font-bold px-3 py-1 rounded-full transition-all ${lang==='en'?'bg-blue-600 text-white':'bg-slate-800 text-slate-500'}`}>English</span>
                  <span class={`text-[9px] font-bold px-3 py-1 rounded-full transition-all font-ta ${lang==='ta'?'bg-emerald-600 text-white':'bg-slate-800 text-slate-500'}`}>தமிழ்</span>
                </div>
              </div>
            )}

            {/* Home indicator */}
            <div class="py-3 flex justify-center bg-slate-950 flex-shrink-0">
              <div class="w-24 h-1 bg-slate-800 rounded-full"></div>
            </div>
          </div>
        </div>
      </div>
    );

    /* ============================================================
       MAIN RENDER
    ============================================================ */
    return (
      <div class={`min-h-screen pb-24 no-overflow ${lang==='ta'?'font-ta':'font-en'}`}>
        
        {/* ======== SPLASH SCREEN ======== */}
        {showSplash && <SplashScreen onComplete={handleSplashComplete} />}

        {/* ======== HEADER ======== */}
        <header class="glass border-b border-slate-200/80 sticky top-0 z-50 shadow-[0_2px_20px_rgba(0,0,0,0.05)]">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3 flex-wrap">
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-3xl flex-shrink-0">🌾</span>
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <h1 class="text-xl sm:text-2xl font-black text-emerald-900 tracking-tight leading-none">
                    UZHAVAI <span class="text-emerald-600 font-ta text-lg sm:text-xl">உழவை</span>
                  </h1>
                  <span class="text-[9px] font-bold px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full border border-emerald-200 flex-shrink-0">{t('badge')}</span>
                </div>
                <p class="text-[10px] text-slate-500 font-medium leading-tight mt-0.5 hidden sm:block break-words">{t('tagline')}</p>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0 flex-wrap justify-end">
              <div class="hidden sm:flex items-center gap-1.5 text-[10px] font-bold px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>{t('espLive')}
              </div>
              <div class="flex items-center gap-1.5 text-[10px] sm:text-[11px] font-black px-2.5 sm:px-3 py-1.5 rounded-full bg-orange-50 border border-orange-200 text-orange-800">
                📅 {t('day')} {currentDay}
              </div>
              <div class="flex bg-slate-100 rounded-xl border border-slate-200 p-0.5 gap-0.5">
                {['en','ta'].map(l => (
                  <button key={l} onClick={() => setLang(l)}
                    aria-label={l==='en'?'Switch to English':'தமிழுக்கு மாற்று'}
                    class={`px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all touch-target ${lang===l?'bg-white text-emerald-800 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>
                    {l==='en' ? 'EN' : 'தமிழ்'}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </header>

        {/* ======== MAIN ======== */}
        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 sm:py-8">

          {/*
            LAYOUT STRATEGY:
            - HERO is rendered ABOVE the columns on mobile (md:hidden),
              and INSIDE the left column on desktop (hidden md:block).
            - Right column (Simulator + Phone) has order-1 on mobile → appears first.
            - Left column has order-2 on mobile → appears second.
            - This achieves the mobile order: Hero → Sim → Phone → Impact → Overview → Zones…
          */}

          {/* HERO — Mobile position (above columns) */}
          <div class="mb-5 sm:mb-6 md:hidden">
            {renderHero()}
          </div>

          <div class="flex flex-col md:flex-row gap-5 sm:gap-6 lg:gap-8">

            {/* ====== LEFT COLUMN ====== */}
            <div class="w-full md:w-[60%] space-y-5 sm:space-y-6 order-2 md:order-1">

              {/* HERO — Desktop position (inside left col) */}
              <div class="hidden md:block">
                {renderHero()}
              </div>

              {renderImpact()}
              {renderOverview()}
              {renderPriority()}
              {renderZones()}
              {renderWhyHW()}
              {renderImpactStats()}
              {renderHistory()}
            </div>

            {/* ====== RIGHT COLUMN ====== */}
            <div class="w-full md:w-[40%] space-y-5 sm:space-y-6 order-1 md:order-2">
              {renderSimulator()}
              {renderPhone()}
            </div>
          </div>
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
